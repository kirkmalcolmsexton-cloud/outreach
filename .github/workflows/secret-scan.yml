name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - "**"

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# gitleaks lists PR commits via the REST API — needs pull-requests:read or you get 403
# "Resource not accessible by integration" on GET .../pulls/:id/commits.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
