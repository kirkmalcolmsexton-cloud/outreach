# Decrypt outreach-secrets.json.age, merge release Maps key, decode upload keystore, bundle signed release AAB.
# Requires repository secrets OUTREACH_SECRETS_PASSPHRASE and ANDROID_UPLOAD_* (see docs/release-process.md).
name: Android release bundle

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
      - "hotfix/**"

concurrency:
  group: android-release-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    env:
      OUTREACH_SECRETS_PASSPHRASE: ${{ secrets.OUTREACH_SECRETS_PASSPHRASE }}
      OUTREACH_MAPS_KEY_FIELD: release_api_key
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Require OUTREACH_SECRETS_PASSPHRASE
        run: |
          if [ -z "${OUTREACH_SECRETS_PASSPHRASE:-}" ]; then
            echo "::error::Repository secret OUTREACH_SECRETS_PASSPHRASE is not set or not available to this workflow (empty value)."
            exit 1
          fi

      - name: Require ANDROID_UPLOAD_* secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          err=0
          [ -n "${ANDROID_UPLOAD_KEYSTORE_BASE64:-}" ] || { echo "::error::Repository secret ANDROID_UPLOAD_KEYSTORE_BASE64 is empty or unset."; err=1; }
          [ -n "${ANDROID_UPLOAD_KEYSTORE_PASSWORD:-}" ] || { echo "::error::Repository secret ANDROID_UPLOAD_KEYSTORE_PASSWORD is empty or unset."; err=1; }
          [ -n "${ANDROID_UPLOAD_KEY_ALIAS:-}" ] || { echo "::error::Repository secret ANDROID_UPLOAD_KEY_ALIAS is empty or unset."; err=1; }
          [ -n "${ANDROID_UPLOAD_KEY_PASSWORD:-}" ] || { echo "::error::Repository secret ANDROID_UPLOAD_KEY_PASSWORD is empty or unset."; err=1; }
          exit "$err"

      - name: Install age, jq, expect
        run: sudo apt-get update && sudo apt-get install -y age jq expect

      - name: Place Gradle properties for CI
        run: cp gradle.properties.example gradle.properties

      - name: Decrypt secrets and materialize google-services + MAPS_API_KEY
        working-directory: ${{ github.workspace }}
        run: bash android/scripts/setup-secrets.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/outreach-upload.jks"
          if ! [ -s "${RUNNER_TEMP}/outreach-upload.jks" ]; then
            echo "::error::Decoded keystore at ${RUNNER_TEMP}/outreach-upload.jks is missing or empty (check ANDROID_UPLOAD_KEYSTORE_BASE64)."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle release
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/outreach-upload.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew bundleRelease --no-daemon

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
