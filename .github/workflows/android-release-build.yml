# Android signed release `.aab`: `android/scripts/build.sh release-bundle` (same implementation as `android/scripts/build-release-bundle.sh`).
# Internally uses `android/scripts/setup-secrets.sh`; repo-mode signing decrypts `secrets/upload-keystore.jks.age` via `scripts/decrypt-age-passphrase.sh`.
# Operators encrypt with `scripts/encrypt-secrets.sh` / `android/scripts/encrypt-upload-keystore-age.sh` (`scripts/encrypt-upload-keystore-age.sh` forwards for compatibility).
# Legacy signing: ANDROID_UPLOAD_* repository secrets + base64 keystore (see docs/release-process.md).
name: Android release bundle

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
      - "hotfix/**"

concurrency:
  group: android-release-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OUTREACH_SECRETS_PASSPHRASE: ${{ secrets.OUTREACH_SECRETS_PASSPHRASE }}
  # Legacy mode only: script checks all four; unset secrets become empty and repo mode is used when applicable.
  ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
  ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
  ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
  ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require OUTREACH_SECRETS_PASSPHRASE
        run: |
          if [ -z "${OUTREACH_SECRETS_PASSPHRASE:-}" ]; then
            echo "::error::Repository secret OUTREACH_SECRETS_PASSPHRASE is not set or not available to this workflow (empty value)."
            exit 1
          fi

      - name: Install age, jq, expect
        run: sudo apt-get update && sudo apt-get install -y age jq expect

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle release
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          bash "${GITHUB_WORKSPACE}/android/scripts/build.sh" release-bundle

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
