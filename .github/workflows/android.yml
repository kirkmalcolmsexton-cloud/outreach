# Core Android CI: JVM tests, lint, debug compile (verify) + emulator instrumentation.
# verify and instrumented run in parallel to shorten wall-clock time. Tradeoff: if verify would
# fail (compile/unit tests), instrumented may still spend time building APKs + emulator (~30+ min).
# Entry: `${GITHUB_WORKSPACE}/android/scripts/build.sh` (`ci verify` | `ci build-instrumented-apks` | `ci connected-mock`) —
# same as locally from `android/` via `./scripts/build.sh …`. Top-level `scripts/` (encrypt-secrets, decrypt-age-passphrase,
# …) are not invoked by these CI targets; release bundle uses them via `android/scripts/build.sh release-bundle`.
# android/gradle.properties is committed (version + Gradle flags); CI uses it from checkout.
name: Android CI

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Fork PRs: no repository secrets beyond GITHUB_TOKEN; same build path as internal PRs.
    env:
      MAPS_API_KEY: ci-placeholder-maps-not-used-at-runtime
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check (compile, unit tests, lint)
        run: bash "${GITHUB_WORKSPACE}/android/scripts/build.sh" ci verify

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAPS_API_KEY: ci-placeholder-maps-not-used-at-runtime
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build APKs before starting the emulator so the AVD is not idle during a long compile
      # (idle emulators on CI often hit "Can't find service: package" when installing).
      - name: Build debug and androidTest APKs
        run: bash "${GITHUB_WORKSPACE}/android/scripts/build.sh" ci build-instrumented-apks

      # emulator-runner runs each YAML line of `script` as its own `sh -c` (no shared cwd).
      - name: Run instrumentation tests (mock auth)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          script: bash "${GITHUB_WORKSPACE}/android/scripts/build.sh" ci connected-mock
